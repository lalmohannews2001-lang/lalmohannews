<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>লালমোহন নিউজ – Lalmohan News</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@400;600;800&family=Hind+Siliguri:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f3ec;--card:#fbf9f4;--ink:#1c1b19;--mute:#6a655b;--rule:#c9c2b3;--accent:#9c2a1f;--navbg:#1c1b19;--navfg:#f6f3ec;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17161a;--card:#1e1d22;--ink:#ece8df;--mute:#a49f93;--rule:#3a383f;--accent:#e0675a;--navbg:#ece8df;--navfg:#17161a}}
:root[data-theme="dark"]{--bg:#17161a;--card:#1e1d22;--ink:#ece8df;--mute:#a49f93;--rule:#3a383f;--accent:#e0675a;--navbg:#ece8df;--navfg:#17161a}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hind Siliguri","Noto Sans Bengali",system-ui,sans-serif;font-size:17px;line-height:1.7}
h1,h2,h3{font-family:"Noto Serif Bengali","Kalpurush",serif;line-height:1.35;margin:0}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
.top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--mute);padding:10px 0;border-bottom:1px solid var(--rule)}
.top button{background:none;border:1px solid var(--rule);color:var(--ink);border-radius:4px;padding:0 10px;font:inherit;font-size:13px;cursor:pointer}
.mast{text-align:center;padding:12px 0 8px;border-bottom:4px double var(--ink)}
.mast h1{font-size:clamp(40px,9vw,76px);font-weight:800;letter-spacing:.5px;color:var(--ink)}
.mast h1 .r{color:#d4201a}
.mast h1{display:flex;align-items:center;justify-content:center;gap:.2em}
.logo{width:.85em;height:.85em;flex:none}
.mast h1.brand{display:block;margin:0}
.mast h1 img{display:block;margin:0 auto;width:min(440px,92%);height:auto;mix-blend-mode:multiply}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .mast h1 img{mix-blend-mode:normal;background:#fff;border-radius:10px}}
:root[data-theme="dark"] .mast h1 img{mix-blend-mode:normal;background:#fff;border-radius:10px}
.mast p{margin:2px 0 0;color:var(--mute);font-size:14px}
nav{background:var(--navbg);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
nav .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav button{flex:none;background:none;border:0;color:var(--navfg);font:500 16px "Hind Siliguri",sans-serif;padding:10px 14px;cursor:pointer;opacity:.75;border-bottom:3px solid transparent}
nav button:hover{opacity:1}
nav button[aria-pressed="true"]{opacity:1;border-bottom-color:var(--accent)}
nav button:focus-visible,.top button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ticker{display:flex;gap:12px;align-items:center;border-bottom:1px solid var(--rule);padding:8px 0;font-size:15px;overflow:hidden;white-space:nowrap}
.ticker b{background:var(--accent);color:#fff;padding:0 10px;border-radius:3px;font-size:14px;flex:none}
.ticker span{overflow:hidden;text-overflow:ellipsis}
.grid{display:grid;grid-template-columns:2fr 1fr;gap:0 28px;padding:22px 0}
.main{padding-right:28px;border-right:1px solid var(--rule)}
.tag{color:var(--accent);font-weight:600;font-size:14px}
.lead h2{font-size:clamp(28px,5vw,44px);font-weight:800;margin:4px 0 10px}
.lead p{font-size:19px;color:var(--ink);margin:0 0 8px}
.meta{font-size:13.5px;color:var(--mute)}
.pic{background:repeating-linear-gradient(135deg,var(--rule) 0 2px,transparent 2px 12px),var(--card);aspect-ratio:16/8;border:1px solid var(--rule);margin:12px 0;display:flex;align-items:flex-end;padding:8px 12px;color:var(--mute);font-size:13px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:0 24px;margin-top:20px;border-top:1px solid var(--ink)}
.story{padding:16px 0;border-bottom:1px solid var(--rule)}
.story h3{font-size:21px;font-weight:600;margin:2px 0 6px}
.story p{margin:0 0 6px;font-size:16px;color:var(--mute)}
aside h2{font-size:20px;border-bottom:2px solid var(--ink);padding-bottom:6px;margin-bottom:4px}
aside ol{list-style:none;margin:0 0 24px;padding:0;counter-reset:n}
aside li{counter-increment:n;display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--rule);font-family:"Noto Serif Bengali",serif;font-size:17px;line-height:1.5}
aside li::before{content:counter(n,bengali);font-size:28px;font-weight:800;color:var(--accent);line-height:1}
.box{background:var(--card);border:1px solid var(--rule);padding:14px 16px;margin-bottom:24px}
.box p{margin:6px 0 0;font-size:16px}
.hide{display:none}
.empty{padding:30px 0;color:var(--mute);text-align:center}
footer{border-top:4px double var(--ink);padding:18px 0 30px;text-align:center;color:var(--mute);font-size:14px}
@media (max-width:800px){.grid{grid-template-columns:1fr}.main{padding-right:0;border-right:0}.cols{grid-template-columns:1fr}}
</style>
</head>

{c:"প্রযুক্তি",t:"স্থানীয় স্টার্টআপের তৈরি অ্যাপ ছড়াচ্ছে গ্রামে গ্রামে",s:"কৃষকদের আবহাওয়ার পূর্বাভাস ও বাজারদর জানাচ্ছে বাংলা ভাষার এই অ্যাপ।",m:"প্রযুক্তি ডেস্ক · ৫ ঘণ্টা আগে"},
{c:"বিনোদন",t:"মুক্তি পাচ্ছে বহু প্রতীক্ষিত পারিবারিক চলচ্চিত্র",s:"শুক্রবার থেকে দেশের বিভিন্ন প্রেক্ষাগৃহে চলবে ছবিটি। অগ্রিম টিকিট বিক্রি শুরু।",m:"বিনোদন প্রতিবেদক · ৬ ঘণ্টা আগে"},
{c:"আন্তর্জাতিক",t:"জলবায়ু সম্মেলনে নবায়নযোগ্য জ্বালানির নতুন অঙ্গীকার",s:"বিভিন্ন দেশের প্রতিনিধিরা আগামী দশকের লক্ষ্য নিয়ে আলোচনায় বসছেন।",m:"আন্তর্জাতিক ডেস্ক · ৭ ঘণ্টা আগে"},
{c:"জাতীয়",t:"নদীভাঙন রোধে নতুন বাঁধ প্রকল্পের কাজ শুরু",s:"স্থানীয় বাসিন্দারা বলছেন, প্রকল্প শেষ হলে হাজারো পরিবার নিরাপদ হবে।",m:"নিজস্ব প্রতিবেদক · ৮ ঘণ্টা আগে"},
{c:"অর্থনীতি",t:"রপ্তানি আয়ে ইতিবাচক ধারা অব্যাহত",s:"চলতি অর্থবছরের প্রথম প্রান্তিকে আয় বেড়েছে, জানাল সংশ্লিষ্ট সংস্থা।",m:"অর্থনীতি ডেস্ক · ৯ ঘণ্টা আগে"}
];
var cats=["সব খবর","জাতীয়","অর্থনীতি","খেলা","প্রযুক্তি","বিনোদন","আন্তর্জাতিক"];
var cur="সব খবর";
function esc(x){return x.replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function render(){
  var items=cur==="সব খবর"?N:N.filter(function(n){return n.c===cur});
  var lead=document.getElementById("lead"),list=document.getElementById("list"),em=document.getElementById("empty");
  if(!items.length){lead.innerHTML="";list.innerHTML="";em.classList.remove("hide");return}
  em.classList.add("hide");
  var l=items[0];
  lead.innerHTML='<span class="tag">'+esc(l.c)+'</span><h2>'+esc(l.t)+'</h2><div class="pic">ছবি: নমুনা আলোকচিত্র</div><p>'+esc(l.s)+'</p><div class="meta">'+esc(l.m)+'</div>';
  list.innerHTML=items.slice(1).map(function(n){return'<div class="story"><span class="tag">'+esc(n.c)+'</span><h3>'+esc(n.t)+'</h3><p>'+esc(n.s)+'</p><div class="meta">'+esc(n.m)+'</div></div>'}).join("");
}
function tabs(){
  var t=document.getElementById("tabs");
  t.innerHTML=cats.map(function(c){return'<button type="button" aria-pressed="'+(c===cur)+'">'+c+'</button>'}).join("");
  Array.prototype.forEach.call(t.children,function(b,i){b.onclick=function(){cur=cats[i];tabs();render()}});
}
document.getElementById("top").innerHTML=N.slice(0,5).map(function(n){return"<li>"+esc(n.t)+"</li>"}).join("");
document.getElementById("tick").textContent=N.slice(0,3).map(function(n){return n.t}).join("  |  ");
try{document.getElementById("date").textContent=new Date().toLocaleDateString("bn-BD",{weekday:"long",year:"numeric",month:"long",day:"numeric"})}catch(e){}
document.getElementById("theme").onclick=function(){
  var r=document.documentElement,d=r.getAttribute("data-theme");
  var dark=d?d==="dark":matchMedia("(prefers-color-scheme:dark)").matches;
  r.setAttribute("data-theme",dark?"light":"dark");
};
tabs();render();
</script>
</body>
</html>
